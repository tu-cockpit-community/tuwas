beschreibung: |
  Dieser Kurs bringt dir **Programmieren in Java von Null** bei. Du brauchst keine Vorkenntnisse.
  Jeder Begriff wird erklärt, bevor er benutzt wird, und jedes Programm wird Zeile für Zeile
  durchgegangen.

  Er folgt dem Aufbau von **EP1 an der TU Wien**: Ausdrücke und Datentypen, Verzweigungen, Schleifen,
  Methoden, Rekursion, Arrays (eindimensional und zweidimensional), dazu Suchen, Sortieren und die
  Grundidee der Komplexität (O-Notation). Die Aufgaben sind den **Aufgabenblättern 1–6**, den
  **TUWEL-Quiz** und den **Programmiertests** der letzten Jahre nachgebaut. Alles Prüfbare wird mit
  echtem Java ausgeführt: Du schreibst Methoden und siehst sofort, welche Tests bestehen.

  Bewertet wird in EP1 nicht in einer einzelnen Prüfung, sondern über vier Teile: **Quiz** (40 Punkte,
  vier Stück), **Test** (30 Punkte, Programmieren am Rechner), **Aufgabenblätter** (24 Punkte, mit
  Feedbackgespräch) und zwei Übungen (6 Punkte). Die Kapitel sagen jeweils, welchen Teil sie
  vorbereiten.

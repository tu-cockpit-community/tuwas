id: simulation-6
titel: 'Simulation 6: Theater, Nullstellen, Serverlogs, Grundstück'
art: simulation
dauer_minuten: 120
hinweis: |
  Selbst erstellte Prüfung im Stil von G. Schranz-Kirlinger (4 Beispiele zu je 10 Punkten, 120 Minuten).
  Themen: rationale und irrationale Zahlen, Potenzen mit rationalen Exponenten, lineares
  Gleichungssystem als Textaufgabe, Betrag und Toleranz, arithmetische Folge und Reihe, rekursive Folge
  mit Monotonie- und Beschränktheitsnachweis, vollständige Induktion, hebbare Unstetigkeit,
  Nullstellensatz, Bisektion, Newton-Verfahren, Ableitung aus der Definition, Hauptsatz,
  Kennzahlen und Boxplot, Kosinus- und Sinussatz.

  **Erlaubt:** nicht programmierbarer, nicht grafikfähiger Taschenrechner. Hinweise und Lösungen
  siehst du erst nach der Abgabe.
aufgaben:
  - id: sim9-1
    titel: Zahlen, Potenzen, Kinokarten, Toleranz
    niveau: 3
    punkte: 10
    angabe: |
      **1.1)** (3 P.) Welche der folgenden Zahlen sind rational?

      **1.2)** (2 P.) Vereinfachen Sie für $a > 0$ so weit wie möglich: $\dfrac{a^{3/2}\cdot\sqrt a}{a^{-1}}$.

      **1.3)** (3 P.) Für eine Kinovorstellung wurden 40 Karten verkauft, Erwachsene zahlen 12 Euro, Kinder
      7 Euro. Die Einnahmen betragen 405 Euro. Stellen Sie ein Gleichungssystem auf und berechnen Sie,
      wie viele Erwachsenen- und Kinderkarten verkauft wurden.

      **1.4)** (2 P.) Ein Bauteil soll 30 mm lang sein; die zulässige Abweichung beträgt höchstens 0,2 mm.
      Beschreiben Sie die zulässigen Längen $x$ mit einer Betragsungleichung und geben Sie sie als
      Intervall an.
    teile:
      - typ: auswahl
        label: '1.1) Rationale Zahlen'
        optionen:
          - '$\sqrt{16}$'
          - '$\sqrt{8}$'
          - '$0{,}\overline{12} = 0{,}121212\ldots$'
          - '$\frac{\pi}{2}$'
          - '$(\sqrt2)^2$'
          - '$\frac13 + \sqrt2$'
          - '$\sqrt2\cdot\sqrt8$'
        richtig: [0, 2, 4, 6]
        mehrfach: true
      - typ: term
        label: '1.2) vereinfachter Term'
        variable: a
        bereich: [0.5, 3]
        loesung: "a^3"
      - typ: vektor
        label: '1.3) (Erwachsene, Kinder)'
        namen: ["E", "K"]
        loesung: ["25", "15"]
      - typ: text
        label: '1.4) Betragsungleichung'
        muster: '$|x - 30| \le 0{,}2$ (in mm)'
      - typ: zahl
        label: '1.4) kleinste zulässige Länge'
        loesung: "29.8"
        anzeige: '29{,}8'
        einheit: mm
      - typ: zahl
        label: '1.4) größte zulässige Länge'
        loesung: "30.2"
        anzeige: '30{,}2'
        einheit: mm
    hinweise:
      - '1.1) Eine Zahl ist rational, wenn sie sich als Bruch ganzer Zahlen schreiben lässt. Periodische Dezimalzahlen sind rational. Vereinfache Wurzelausdrücke zuerst.'
      - '1.2) Schreibe $\sqrt a = a^{1/2}$ und $\frac{1}{a^{-1}} = a$, dann Exponenten addieren.'
      - '1.3) $x$ Erwachsene, $y$ Kinder: $x + y = 40$, $12x + 7y = 405$.'
    loesung: |
      **1.1)** $\sqrt{16} = 4$ ✓. $\sqrt8 = 2\sqrt2$ irrational ✗. $0{,}\overline{12} = \frac{12}{99} = \frac{4}{33}$ ✓.
      $\frac\pi2$ irrational ✗. $(\sqrt2)^2 = 2$ ✓. $\frac13 + \sqrt2$: wäre sie rational, dann auch
      $\sqrt2 = (\frac13 + \sqrt2) - \frac13$ (Differenz rationaler Zahlen), Widerspruch ✗.
      $\sqrt2\cdot\sqrt8 = \sqrt{16} = 4$ ✓.
      ---
      **1.2)** $\frac{a^{3/2}\cdot a^{1/2}}{a^{-1}} = a^{3/2 + 1/2 - (-1)} = a^{3}$.
      ---
      **1.3)** $x + y = 40$ und $12x + 7y = 405$. $y = 40 - x$ einsetzen: $12x + 280 - 7x = 405 \iff 5x = 125 \iff x = 25$, $y = 15$.
      Probe: $25\cdot 12 + 15\cdot 7 = 300 + 105 = 405$ ✓. Also 25 Erwachsenen- und 15 Kinderkarten.
      ---
      **1.4)** $|x - 30| \le 0{,}2 \iff -0{,}2 \le x - 30 \le 0{,}2 \iff 29{,}8 \le x \le 30{,}2$, also $x \in [29{,}8;\ 30{,}2]$ mm.

  - id: sim9-2
    titel: Theaterreihen, eine rekursive Folge und Induktion
    niveau: 3
    punkte: 10
    angabe: |
      **2.1)** (3 P.) Ein Theater hat 25 Sitzreihen. In der ersten Reihe stehen 20 Sitze, jede weitere Reihe
      hat 2 Sitze mehr als die vorige. Wie viele Sitze hat die letzte Reihe, wie viele Sitze hat das
      Theater insgesamt?

      **2.2)** (4 P.) Die Folge $(a_n)$ ist rekursiv definiert durch $a_1 = 2$ und $a_{n+1} = \frac12 a_n + 3$.

      (a) Berechnen Sie $a_2$, $a_3$, $a_4$.

      (b) Zeigen Sie mit vollständiger Induktion, dass $a_n < 6$ für alle $n \ge 1$ gilt, und zeigen Sie, dass
      die Folge streng monoton wachsend ist.

      (c) Begründen Sie, warum die Folge konvergiert, und berechnen Sie ihren Grenzwert.

      **2.3)** (3 P.) Beweisen Sie mit vollständiger Induktion: Für alle $n \ge 1$ gilt
      $$1 + 3 + 5 + \ldots + (2n - 1) = \sum_{k=1}^{n}(2k - 1) = n^2.$$
    teile:
      - typ: zahl
        label: '2.1) Sitze in Reihe 25'
        loesung: "20 + 24*2"
        anzeige: '68'
      - typ: zahl
        label: '2.1) Sitze insgesamt'
        loesung: "25*(20 + 68)/2"
        anzeige: '1100'
      - typ: vektor
        label: '2.2 a) $(a_2, a_3, a_4)$'
        loesung: ["4", "5", "5.5"]
      - typ: text
        label: '2.2 b) Beschränktheit und Monotonie'
        muster: |
          Induktion für $a_n < 6$: Anfang $a_1 = 2 < 6$. Schritt: Aus $a_n < 6$ folgt
          $a_{n+1} = \frac12 a_n + 3 < \frac12\cdot 6 + 3 = 6$.
          Monotonie: $a_{n+1} - a_n = 3 - \frac12 a_n = \frac12(6 - a_n) > 0$, weil $a_n < 6$. Also streng
          monoton wachsend.
      - typ: zahl
        label: '2.2 c) Grenzwert'
        loesung: "6"
      - typ: text
        label: '2.3) Induktionsbeweis'
        muster: |
          **Anfang** $n = 1$: links $1$, rechts $1^2 = 1$ ✓.
          **Voraussetzung:** $\sum_{k=1}^{n}(2k-1) = n^2$ für ein $n \ge 1$.
          **Schritt:** $\sum_{k=1}^{n+1}(2k-1) = n^2 + (2(n+1) - 1) = n^2 + 2n + 1 = (n+1)^2$.
          Damit gilt die Formel für alle $n \ge 1$.
    hinweise:
      - '2.1) Arithmetische Folge mit $a_1 = 20$, $d = 2$: $a_n = a_1 + (n-1)d$, $s_n = \frac n2(a_1 + a_n)$.'
      - '2.2 b) Für die Monotonie $a_{n+1} - a_n$ berechnen und die Schranke aus dem Induktionsbeweis verwenden.'
      - '2.2 c) Monotoniekriterium: monoton und beschränkt ⇒ konvergent. Für den Grenzwert $a$ in der Rekursion $a = \frac12 a + 3$ setzen.'
    loesung: |
      **2.1)** $a_{25} = 20 + 24\cdot 2 = 68$ Sitze. Gesamt: $s_{25} = \frac{25}{2}(20 + 68) = 25\cdot 44 = 1100$ Sitze.
      ---
      **2.2 a)** $a_2 = 1 + 3 = 4$, $a_3 = 2 + 3 = 5$, $a_4 = 2{,}5 + 3 = 5{,}5$. Vermutung: wachsend gegen 6.
      ---
      **2.2 b)** Induktion: $a_1 = 2 < 6$; gilt $a_n < 6$, dann $a_{n+1} = \frac12 a_n + 3 < 3 + 3 = 6$.
      Monotonie: $a_{n+1} - a_n = 3 - \frac12 a_n = \frac12(6 - a_n) > 0$.
      ---
      **2.2 c)** Die Folge ist streng monoton wachsend und nach oben durch 6 beschränkt, nach dem
      Monotoniekriterium (Vollständigkeit von $\R$) also konvergent. Für den Grenzwert $a$ gilt
      $a = \frac12 a + 3 \iff a = 6$.
      ---
      **2.3)** Induktionsanfang $n = 1$: $1 = 1^2$ ✓. Induktionsschritt $n \to n + 1$ unter der Voraussetzung
      $\sum_{k=1}^n (2k-1) = n^2$: $\sum_{k=1}^{n+1}(2k - 1) = n^2 + 2n + 1 = (n + 1)^2$ ✓.

  - id: sim9-3
    titel: Stetigkeit, Nullstellen und Ableitungen exakt
    niveau: 3
    punkte: 10
    angabe: |
      **3.1)** (2 P.) Die Funktion $f(x) = \dfrac{x^2 - 4}{x - 2}$ ist für $x \neq 2$ definiert. Welche Art von
      Definitionslücke liegt bei $x = 2$ vor? Wie muss man $f(2)$ festlegen, damit eine stetige
      Fortsetzung entsteht?

      **3.2)** (4 P.) Gegeben ist $p(x) = x^3 + x - 1$.

      (a) Begründen Sie mit dem Nullstellensatz, dass $p$ im Intervall $[0, 1]$ eine Nullstelle hat.

      (b) Führen Sie drei Schritte des Bisektionsverfahrens durch, beginnend mit $[0, 1]$. In welchem
      Intervall liegt die Nullstelle danach?

      (c) Führen Sie einen Schritt des Newton-Verfahrens mit Startwert $x_0 = 1$ durch.

      **3.3)** (2 P.) Berechnen Sie die Ableitung von $g(x) = \frac1x$ an der Stelle $x_0 = 2$ direkt als
      Grenzwert des Differenzenquotienten.

      **3.4)** (2 P.) Gegeben ist $F(x) = \int_0^x t\cos t\,\dd t$. Berechnen Sie $F'(\pi)$ ohne das Integral
      auszurechnen und nennen Sie den verwendeten Satz.
    teile:
      - typ: auswahl
        label: '3.1) Art der Definitionslücke'
        optionen: [Polstelle, Sprungstelle, hebbare Definitionslücke]
        richtig: [2]
      - typ: zahl
        label: '3.1) $f(2)$ für die stetige Fortsetzung'
        loesung: "4"
      - typ: text
        label: '3.2 a) Begründung'
        muster: |
          $p$ ist als Polynom stetig auf $[0, 1]$, und $p(0) = -1 < 0 < 1 = p(1)$. Nach dem Nullstellensatz
          (Bolzano) gibt es ein $\xi \in (0, 1)$ mit $p(\xi) = 0$.
      - typ: zahl
        label: '3.2 b) linke Grenze nach 3 Schritten'
        loesung: "0.625"
        anzeige: '0{,}625'
      - typ: zahl
        label: '3.2 b) rechte Grenze nach 3 Schritten'
        loesung: "0.75"
        anzeige: '0{,}75'
      - typ: zahl
        label: '3.2 c) $x_1$'
        loesung: "1 - (1 + 1 - 1)/(3 + 1)"
        anzeige: '0{,}75'
      - typ: zahl
        label: "3.3) $g'(2)$"
        loesung: "-1/4"
        anzeige: '-\tfrac14'
      - typ: zahl
        label: "3.4) $F'(\\pi)$"
        loesung: "pi*cos(pi)"
        anzeige: '-\pi \approx -3{,}1416'
    hinweise:
      - '3.1) Zähler faktorisieren: $x^2 - 4 = (x-2)(x+2)$.'
      - '3.2 b) Intervall halbieren, $p$ in der Mitte auswerten und das Teilintervall mit Vorzeichenwechsel behalten.'
      - "3.2 c) $x_1 = x_0 - \\frac{p(x_0)}{p'(x_0)}$ mit $p'(x) = 3x^2 + 1$."
      - '3.3) $\frac{g(2 + h) - g(2)}{h}$ auf einen Bruchstrich bringen und $h$ kürzen.'
      - '3.4) Hauptsatz der Differential- und Integralrechnung: Ist $f$ stetig, so ist $\left(\int_a^x f(t)\,\dd t\right)'' = f(x)$.'
    loesung: |
      **3.1)** $f(x) = \frac{(x - 2)(x + 2)}{x - 2} = x + 2$ für $x \neq 2$. $\lim_{x\to2} f(x) = 4$ existiert:
      hebbare Definitionslücke. Mit $f(2) := 4$ entsteht die stetige Fortsetzung $x + 2$.
      ---
      **3.2 a)** $p$ stetig, $p(0) = -1 < 0$, $p(1) = 1 > 0$: Nach dem Nullstellensatz gibt es eine Nullstelle in $(0, 1)$.
      ---
      **3.2 b)** $p(0{,}5) = 0{,}125 + 0{,}5 - 1 = -0{,}375 < 0 \Rightarrow [0{,}5;\ 1]$.
      $p(0{,}75) = 0{,}421875 + 0{,}75 - 1 = 0{,}171875 > 0 \Rightarrow [0{,}5;\ 0{,}75]$.
      $p(0{,}625) = 0{,}244140625 + 0{,}625 - 1 \approx -0{,}1309 < 0 \Rightarrow [0{,}625;\ 0{,}75]$.
      ---
      **3.2 c)** $p(1) = 1$, $p'(1) = 4$: $x_1 = 1 - \frac14 = 0{,}75$. (Die Nullstelle liegt bei etwa $0{,}6823$.)
      ---
      **3.3)** $\frac{g(2 + h) - g(2)}{h} = \frac{\frac{1}{2 + h} - \frac12}{h} = \frac{2 - (2 + h)}{2(2 + h)\,h} = \frac{-1}{2(2 + h)}$
      für $h \neq 0$. Für $h \to 0$: $g'(2) = -\frac14$ (passt zu $g'(x) = -\frac{1}{x^2}$).
      ---
      **3.4)** Der Integrand $t\cos t$ ist stetig. Nach dem Hauptsatz ist $F'(x) = x\cos x$, also
      $F'(\pi) = \pi\cos\pi = -\pi$.

  - id: sim9-4
    titel: Antwortzeiten eines Servers und ein Grundstück
    niveau: 3
    punkte: 10
    angabe: |
      **4.1)** (6 P.) Ein Webserver protokolliert die Antwortzeiten (in ms) von 9 Anfragen:
      $$12,\ 15,\ 11,\ 14,\ 13,\ 40,\ 12,\ 15,\ 13$$

      (a) Berechnen Sie arithmetisches Mittel und Median.

      (b) Bestimmen Sie das untere und obere Quartil (Median der unteren bzw. oberen Hälfte, jeweils ohne
      den Gesamtmedian) und den Interquartilsabstand. Zeichnen Sie einen Boxplot.

      (c) Ein Wert gilt als Ausreißer, wenn er mehr als das 1,5-Fache des Interquartilsabstands über dem
      oberen Quartil liegt. Gibt es Ausreißer? Wie ändert sich das Mittel ohne ihn? Welche Kennzahl
      beschreibt hier die „typische“ Antwortzeit besser?

      **4.2)** (4 P.) Von einem dreieckigen Grundstück kennt man zwei Seiten, 80 m und 50 m, sowie den
      eingeschlossenen Winkel $60°$. Berechnen Sie die dritte Seite, den Flächeninhalt und den Winkel, der
      der 50 m langen Seite gegenüberliegt.
    teile:
      - typ: zahl
        label: '4.1 a) Mittelwert'
        loesung: "mean(12, 15, 11, 14, 13, 40, 12, 15, 13)"
        anzeige: '16{,}11'
        einheit: ms
        toleranz: 0.01
      - typ: zahl
        label: '4.1 a) Median'
        loesung: "median(12, 15, 11, 14, 13, 40, 12, 15, 13)"
        anzeige: '13'
        einheit: ms
      - typ: zahl
        label: '4.1 b) unteres Quartil $Q_1$'
        loesung: "12"
        einheit: ms
      - typ: zahl
        label: '4.1 b) oberes Quartil $Q_3$'
        loesung: "15"
        einheit: ms
      - typ: zahl
        label: '4.1 b) Interquartilsabstand'
        loesung: "15 - 12"
        anzeige: '3'
        einheit: ms
      - typ: zahl
        label: '4.1 c) Mittelwert ohne Ausreißer'
        loesung: "(145 - 40)/8"
        anzeige: '13{,}125'
        einheit: ms
        toleranz: 0.01
      - typ: text
        label: '4.1 b, c) Boxplot, Ausreißer, Interpretation'
        muster: |
          Boxplot: Box von 12 bis 15 mit Strich beim Median 13; Whisker bis 11 und bis 15 (größter Wert, der
          kein Ausreißer ist), der Wert 40 als einzelner Punkt. Grenze: $Q_3 + 1{,}5\cdot 3 = 19{,}5$, also ist 40
          ein Ausreißer. Ohne ihn sinkt das Mittel von 16,11 auf 13,125 ms. Der Median (13 ms) ist robust
          gegen den Ausreißer und beschreibt die typische Antwortzeit besser; das Mittel wird von einem
          einzelnen langsamen Request stark verzerrt.
      - typ: zahl
        label: '4.2) dritte Seite'
        loesung: "sqrt(80^2 + 50^2 - 2*80*50*cos(inRad(60)))"
        anzeige: '70'
        einheit: m
      - typ: zahl
        label: '4.2) Flächeninhalt'
        loesung: "0.5*80*50*sin(inRad(60))"
        anzeige: '1000\sqrt3 \approx 1732{,}05'
        einheit: m²
        toleranz: 0.5
      - typ: zahl
        label: '4.2) Winkel gegenüber der 50-m-Seite'
        loesung: "inGrad(asin(50*sin(inRad(60))/70))"
        anzeige: '38{,}21'
        einheit: °
        toleranz: 0.05
    hinweise:
      - '4.1) Zuerst die Daten ordnen: $11, 12, 12, 13, 13, 14, 15, 15, 40$.'
      - '4.2) Kosinussatz $c^2 = a^2 + b^2 - 2ab\cos\gamma$; Fläche $\frac12 ab\sin\gamma$; Winkel mit dem Sinussatz (der Winkel gegenüber der kürzesten Seite ist spitz).'
    loesung: |
      **4.1 a)** Summe $= 145$, Mittel $\bar x = \frac{145}{9} \approx 16{,}11$ ms. Geordnet:
      $11, 12, 12, 13, \mathbf{13}, 14, 15, 15, 40$; Median $= 13$ ms (5. Wert).
      ---
      **4.1 b)** Untere Hälfte $11, 12, 12, 13$: $Q_1 = 12$. Obere Hälfte $14, 15, 15, 40$: $Q_3 = 15$.
      $IQR = 3$ ms.
      ---
      **4.1 c)** Grenze $Q_3 + 1{,}5\cdot IQR = 19{,}5$: 40 ms ist ein Ausreißer. Ohne ihn: $\bar x = \frac{105}{8} = 13{,}125$ ms.
      Der Median ist robust und beschreibt die typische Antwortzeit besser als das vom Ausreißer
      verzerrte Mittel.
      ---
      **4.2)** Kosinussatz: $c^2 = 6400 + 2500 - 2\cdot 80\cdot 50\cdot\cos 60° = 8900 - 4000 = 4900$, $c = 70$ m.
      ---
      Fläche: $A = \frac12\cdot 80\cdot 50\cdot\sin 60° = 2000\cdot\frac{\sqrt3}{2} = 1000\sqrt3 \approx 1732{,}05\ \text{m}^2$.
      ---
      Sinussatz: $\sin\beta = \frac{50\sin 60°}{70} \approx 0{,}6186 \Rightarrow \beta \approx 38{,}21°$ (spitz, da
      gegenüber der kürzesten Seite). Kontrolle: dritter Winkel $180° - 60° - 38{,}21° = 81{,}79°$, und
      $\cos 81{,}79° \approx \frac{50^2 + 70^2 - 80^2}{2\cdot 50\cdot 70} = \frac17$ ✓.
